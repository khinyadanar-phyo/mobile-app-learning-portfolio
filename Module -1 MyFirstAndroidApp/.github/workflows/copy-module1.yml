name: Copy My First Application

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v5

      - name: Checkout My First Application
        uses: actions/checkout@v5
        with:
          repository: khinyadanar-phyo/My-First-Application
          path: source-app

      - name: Copy project into Module 1
        run: |
          rsync -av --exclude='.git' source-app/ "Module -1 MyFirstAndroidApp/"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add My First Android Application to Module 1" || echo "No changes to commit"
          git push
